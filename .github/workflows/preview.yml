name: Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::870983875264:role/cloud-preview-github-actions
          aws-region: us-west-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: 870983875264.dkr.ecr.us-west-2.amazonaws.com/cloud-preview-platform:pr-${{ github.event.pull_request.number }}

      - name: Verify image
        run: |
          aws ecr describe-images \
            --repository-name cloud-preview-platform \
            --image-ids imageTag=pr-${{ github.event.pull_request.number }}